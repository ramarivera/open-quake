name: Desktop release

on:
  pull_request:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - name: Resolve version
        id: version
        env:
          BUILD_TAG: ${{ github.event_name == 'push' && github.ref_name || format('v0.0.0-pr.{0}.{1}', github.event.number, github.run_number) }}
        run: node apps/desktop/scripts/release.mjs version "$BUILD_TAG"
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libusb-1.0-0-dev
      # FFmpeg backs the real-codec meeting integration tests. Use a pinned
      # static build from GitHub: the Azure apt mirror repeatedly stalled for
      # longer than the job budget while resolving FFmpeg's dependencies.
      - name: Install FFmpeg
        timeout-minutes: 5
        env:
          FFMPEG_URL: https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-linux-x64.gz
          FFMPEG_SHA256: 17c1ae10b52ac499180679fe6ba77e17642390c4eedb0f1e3b0ac045da55128f
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ffmpeg.gz" "$FFMPEG_URL"
          echo "$FFMPEG_SHA256  $RUNNER_TEMP/ffmpeg.gz" | sha256sum -c -
          gunzip -c "$RUNNER_TEMP/ffmpeg.gz" | sudo tee /usr/local/bin/ffmpeg >/dev/null
          sudo chmod 755 /usr/local/bin/ffmpeg
          ffmpeg -hide_banner -encoders > "$RUNNER_TEMP/ffmpeg-encoders.txt"
          grep ' libmp3lame ' "$RUNNER_TEMP/ffmpeg-encoders.txt"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @open-quake/desktop test:release
      - run: pnpm typecheck
      # Turbo otherwise starts all package suites at once, and each Vitest
      # process starts its own worker pool on the same small runner.
      - run: pnpm exec turbo run test --concurrency=1 -- --maxWorkers=2
      - run: pnpm --filter @open-quake/desktop build
      - run: pnpm --filter @open-quake/desktop test:bundle

  package:
    name: Package ${{ matrix.platform }} ${{ matrix.arch }}
    needs: validate
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            arch: arm64
          - runner: windows-2025
            platform: win
            arch: x64
          - runner: windows-11-arm
            platform: win
            arch: arm64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install Linux native build and runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libusb-1.0-0-dev libfuse2 libgtk-3-0t64 libnss3 libasound2t64 xvfb
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @open-quake/desktop build
      - run: pnpm --filter @open-quake/desktop package --${{ matrix.platform }} --${{ matrix.arch }}
      - name: Smoke packaged Electron, native bindings, preload and renderer
        working-directory: apps/desktop
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a pnpm test:package
          else
            pnpm test:package
          fi
      - name: Collect downloads
        working-directory: apps/desktop
        run: |
          mkdir -p release-assets
          for file in dist/*.dmg dist/*.zip dist/*.exe dist/*.AppImage dist/*.deb; do
            if [[ -f "$file" ]]; then cp "$file" release-assets/; fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: apps/desktop/release-assets/*
          if-no-files-found: error
          retention-days: 7

  verify-assets:
    name: Verify complete download matrix
    needs: [validate, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          # This job runs plain Node scripts without installing dependencies.
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - name: Validate complete matrix and checksum downloads
        run: node apps/desktop/scripts/release.mjs checksums release-assets
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-downloads
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish complete release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, verify-assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          # This job runs plain Node scripts without installing dependencies.
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-downloads
          path: release-assets
      - name: Validate complete matrix and checksum downloads
        run: node apps/desktop/scripts/release.mjs checksums release-assets
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: release-assets/*
      - name: Stage, upload and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/desktop/scripts/publish-release.mjs release-assets
