<!doctype html>
<html lang="en">
	<head><meta charset="utf-8"><title>GIF browser smoke</title></head>
	<body>
		<pre>Running GIF codec and canvas checks...</pre>
		<script type="module">
			import { runGifBrowserSmoke } from "./browser-smoke.ts";

			const output = document.querySelector("pre");
			try {
				const result = await runGifBrowserSmoke();
				output.textContent = JSON.stringify(result, null, 2);
				document.body.dataset.result = "passed";
			} catch (cause) {
				output.textContent = String(cause);
				document.body.dataset.result = "failed";
				throw cause;
			}
		</script>
	</body>
</html>
